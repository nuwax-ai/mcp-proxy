[env]
CMAKE_CUDA_ARCHITECTURES = "60-real;61-real;62-real;70-real;75-real;80-real;86-real"

# macOS：sherpa-onnx shared 模式（CoreML EP 仅 shared 变体启用）把 dylib 放到 binary 旁（profile 目录，
# 即 target/{debug,release}/），但 sys crate 的 `cargo:rustc-link-arg` 不一定透传到下游 binary 的
# LC_RPATH，需显式补 rpath。
# - @loader_path：主 binary（target/release/voice-cli）自身目录
# - @loader_path/..：bench/test binary 在 target/release/deps/，父目录 = target/release/ 才有 dylib
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path,-rpath,@loader_path/.."]
