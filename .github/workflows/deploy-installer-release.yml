# Publish nuwax-deploy-installer to npm (binaries bundled in package)
#
# Tag channels (must push tag from a commit that contains this workflow):
#   Beta:    deploy-v0.2.1-beta.1  →  npm @beta   (prerelease version)
#   Stable:  deploy-v0.2.1         →  npm @latest (no prerelease suffix)
#
# Workflow: always ship beta first, verify on Mac Mini, then ship stable.
#
# Jobs:
#   resolve  — version/channel guard (runs once)
#   build    — per-platform matrix (macos-14 → darwin-arm64, ubuntu-22.04 → linux-x64):
#              build binaries into vendor/<key>/ + smoke test on the native OS,
#              upload the slice as an artifact
#   publish  — merge all platform slices, stamp manifest/package.json once,
#              verify layout, npm publish, report tarball size
#
# Linux build deps: libclang-dev/clang (whisper-rs bindgen), cmake (sherpa/onnx -sys
# crates); the X11/GL apt set satisfies doctor's syslibs preflight on the runner.

name: Deploy Installer Release

on:
  push:
    tags:
      # Stable: deploy-v1.2.3 (no prerelease suffix after the version)
      - 'deploy-v[0-9]+.[0-9]+.[0-9]+'
      # Beta:   deploy-v1.2.3-beta.N
      - 'deploy-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version (stable: 0.2.1 | beta: 0.2.1-beta.2)'
        required: true
        default: '0.2.1-beta.2'
      channel:
        description: 'npm dist-tag channel'
        required: true
        type: choice
        options:
          - beta
          - latest
        default: beta

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - name: Resolve version and channel
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            VERSION="${GITHUB_REF_NAME#deploy-v}"
            if [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-alpha"* || "$VERSION" == *"-rc"* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="latest"
            fi
          fi

          # Guard: channel must match version shape
          if [[ "$CHANNEL" == "beta" ]]; then
            if [[ "$VERSION" != *"-beta"* && "$VERSION" != *"-alpha"* && "$VERSION" != *"-rc"* ]]; then
              echo "::error::channel=beta requires a prerelease version (e.g. 0.2.1-beta.1), got: $VERSION"
              exit 1
            fi
          else
            if [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-alpha"* || "$VERSION" == *"-rc"* ]]; then
              echo "::error::channel=latest forbids prerelease versions, got: $VERSION"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "==> nuwax-deploy-installer@$VERSION → npm dist-tag @$CHANNEL"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            vendor_key: darwin-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            vendor_key: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 注意：不使用 Swatinem/rust-cache——sherpa/onnx 等 -sys crate 构建期下载的
      # 预编译大库会被缓存驱逐，恢复后指纹 fresh 但库文件缺失，voice-cli 链接
      # 必失败（unable to find library -lsherpa-onnx-c-api）。发布走冷构建。

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # whisper-rs bindgen 需要 libclang/clang，sherpa/onnx -sys 需要 cmake；
          # X11/GL 组合满足 doctor 的 syslibs 预检（也是文档中 Debian 系安装命令的活体验证）
          sudo apt-get install -y libclang-dev clang cmake \
            libxcb1 libxkbcommon-x11-0 libgl1 libglib2.0-0

      - name: Update workspace version
        # 必须在每个平台 job 内执行：二进制内嵌 CARGO_PKG_VERSION，需要与发布版本一致
        run: |
          python3 scripts/ci/update-workspace-version.py "${{ needs.resolve.outputs.version }}"

      - name: Build platform slice
        run: |
          bash scripts/ci/build-nuwax-platform-binaries.sh \
            "${{ matrix.target }}" "${{ matrix.vendor_key }}"
          # 模板与版本戳（幂等；publish 合并后会再统一执行一次）
          bash scripts/ci/stamp-nuwax-manifest.sh "${{ needs.resolve.outputs.version }}"

      - name: Smoke test (native platform)
        run: bash scripts/ci/smoke-nuwax-deploy-installer.sh /tmp/doc-parser-smoke

      - name: Upload vendor slice
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.vendor_key }}
          # 上传整个 vendor/：upload-artifact 取文件的最小公共祖先为根，
          # 只传 vendor/<key> 会丢失平台目录层级（内容平铺），合并时无法还原
          path: npm/nuwax-deploy-installer/vendor
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform slices
        uses: actions/download-artifact@v4
        with:
          pattern: vendor-*
          path: npm/nuwax-deploy-installer/vendor
          merge-multiple: true

      - name: Stamp manifest + package.json
        run: bash scripts/ci/stamp-nuwax-manifest.sh "${{ needs.resolve.outputs.version }}"

      - name: Verify merged vendor layout
        run: |
          set -euo pipefail
          for key in darwin-arm64 linux-x64; do
            test -x "npm/nuwax-deploy-installer/vendor/$key/deploy-installer" \
              || { echo "::error::missing $key slice"; exit 1; }
            test -x "npm/nuwax-deploy-installer/vendor/$key/document-parser" \
              || { echo "::error::missing $key document-parser"; exit 1; }
          done
          echo "==> merged vendor layout verified"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Report tarball size
        working-directory: npm/nuwax-deploy-installer
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: npm/nuwax-deploy-installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          echo "==> Publishing nuwax-deploy-installer@${VERSION} with --tag ${CHANNEL}"
          npm publish --access public --tag "$CHANNEL"

          # First-ever package publish also attaches @latest; after a stable
          # release, force @latest onto the stable version explicitly.
          if [[ "$CHANNEL" == "latest" ]]; then
            npm dist-tag add "nuwax-deploy-installer@${VERSION}" latest
            echo "==> dist-tag latest → ${VERSION}"
          else
            echo "==> dist-tag beta → ${VERSION}"
            echo "NOTE: if this is the first publish ever, npm may also set latest=${VERSION}."
            echo "      Formal deploy-v${VERSION%-beta*} will move @latest to the stable version."
          fi

          echo "==> current dist-tags:"
          npm dist-tag ls nuwax-deploy-installer || true
