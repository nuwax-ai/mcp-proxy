# 代码质量门禁：fmt / clippy / test
#
# 说明：
# - 仓库已有 .pre-commit-config.yaml，但仅本地自愿执行，此 workflow 为强制兜底。
# - clippy/test 只覆盖 workspace default-members（不含 fastembed：ort-sys 编译期需联网
#   下载预编译库且耗时数分钟；显式 -p fastembed-server 或 --workspace 才会碰它）。
# - check-heavy 额外校验可离线编译的重型 crate；voice-cli 因 sherpa-onnx 需在编译期
#   从 GitHub releases 下载预编译库（依赖网络与缓存），暂不纳入硬性门禁。

name: CI

on:
  push:
    branches: [main, master, "feat*", "release*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: Clippy (default members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (default members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (核心稳定集)
        # 全 default-members 里 mcp-stdio-proxy 与 run_code_rmcp 含环境依赖
        # 集成测试（真实子进程 / deno / 本地端口），CI 无该环境必挂——
        # main 线 CI 自 2026-08 起红即此因。这两个 crate 的测试在开发机
        # 本地跑（mcp-stdio-proxy 已标注 #[ignore] 的 6 个用 --ignored 手动跑）。
        run: cargo test -p deploy-installer -p document-parser -p oss-client -p mcp-common -p voice-toolkit -p rs-voice-toolkit-audio -p mcp-proxy-args

  check-heavy:
    name: Check heavy crates (best-effort scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: >
          cargo check -p document-parser -p deploy-installer
          -p voice-toolkit -p rs-voice-toolkit-audio

  check-windows:
    name: Check deploy-installer on Windows (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check -p deploy-installer --all-targets
