[package]
name = "mcp-streamable-proxy"
version.workspace = true
edition.workspace = true
authors = ["nuwax-ai"]
description = "Streamable HTTP proxy implementation for MCP protocol using rmcp 3.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuwax-ai/mcp-proxy"
keywords = ["mcp", "proxy", "http", "protocol"]
categories = ["web-programming", "network-programming"]

[dependencies]
# 共享类型和工具
mcp-common = { workspace = true }

# MCP protocol implementation - official rmcp 3.1.1
# Fork rmcp-soddygo 已废弃：官方 3.1.1 已原生容忍子进程往 stdout 写非 JSON 日志（issue #938）
rmcp = { version = "3.1.1", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-io", "transport-async-rw", "reqwest", "base64", "macros"] }

# Concurrent hashmap for session management (better than Arc<RwLock<HashMap>>)
dashmap = { workspace = true }

# Async runtime (添加 signal feature 用于 Ctrl+C 处理)
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Utilities
arc-swap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# 进程组管理（跨平台子进程清理）
# 版本需要与 rmcp 0.13 兼容
# 添加 process-group 特性用于 Unix 平台的进程组管理
# 添加 job-object 特性用于 Windows 平台的进程树管理
process-wrap = { version = "9.1", features = ["tokio1", "process-group", "job-object"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
which = "8.0"
