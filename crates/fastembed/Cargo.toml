[package]
# package 名用 fastembed-server，避免与依赖的 crates.io `fastembed` 库同名冲突；
# [[bin]] name 保持 fastembed，命令名不变。
name = "fastembed-server"
version = "0.1.28"
edition = "2024"

[package.metadata.dist]
dist = false

[[bin]]
name = "fastembed"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# CLI
clap = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Embedding library
# image-models：显式启用 ImageEmbedding（fastembed default 已含，这里显式声明避免被 future default 关闭）
fastembed = { version = "5", features = [
    "ort-download-binaries",
    "hf-hub-native-tls",
    "image-models",
] }
# ort 直接依赖：拿 ort::ep::{CoreML,CUDA,DirectML} 配 GPU execution provider
# 版本须与 fastembed-rs 锁的 ort 一致（=2.0.0-rc.12）
ort = "2.0.0-rc.12"

# Concurrency and caching
dashmap = { workspace = true }
once_cell = { workspace = true }

# Error handling
anyhow = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
