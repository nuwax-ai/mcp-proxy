[package]
name = "voice-cli"
version.workspace = true
edition.workspace = true
authors = ["soddygo <soddygo@qq.com>"]
description = "Speech-to-text HTTP service with CLI interface"
license = "MIT"
repository = "https://github.com/nuwax-ai/mcp-proxy"

[package.metadata.dist]
dist = false

[[bin]]
name = "voice-cli"
path = "src/main.rs"

[dependencies]
# Web framework and HTTP handling
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# OpenAPI documentation generation
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }

# Async runtime
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Configuration management
config = { version = "0.15", features = ["yaml", "json", "toml"] }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-jaeger = { workspace = true, features = ["rt-tokio"] }
opentelemetry-semantic-conventions = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# 国际化支持
rust-i18n = { workspace = true }

# HTTP client for model downloads
# 使用 rustls + webpki-roots（内置 Mozilla 根证书），避免动态链接系统 OpenSSL。
# 这样产物不依赖任何版本的 libssl.so，跨发行版部署不会再出现 libssl.so.1.1 找不到的问题。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }

# Time handling
chrono = { workspace = true, features = ["serde"] }

# Utilities
bytes = "1.0"
futures = { workspace = true }
uuid = { workspace = true, features = ["v4","v7"] }
base64 = "0.22"
tempfile = "3.0"
dirs = "6.0"
url = "2.5"

# Embedded database for task persistence
# sled = { version = "0.34", features = ["compression"] }  # Disabled due to zstd dependency conflict


# Audio format detection with Symphonia
symphonia = { workspace = true }
dashmap = { workspace = true }
infer = "0.19"

# FFmpeg command wrapper（统一到 workspace 2.5，与 voice crates 一致）
ffmpeg-sidecar = { workspace = true }

# Task queue and persistence for async processing
apalis = { version = "0.7", features = ["tracing", "limit", "timeout", "catch-panic", "retry", "filter"] }
apalis-sql = { version = "0.7", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }



[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi"] }

[dependencies.voice-toolkit]
workspace = true

# STT 引擎 transcribe-rs：按平台默认 GPU feature（裸 cargo build 即带平台最优后端）
# - macOS：默认 whisper-metal（Metal framework 系统自带，编译可靠）
# - Linux/其他：默认 whisper-cpp（CPU）；GPU 通过 `--features cuda`/`vulkan` 显式启用
#   （需对应 CUDA toolkit / Vulkan SDK，避免缺 SDK 时默认 build 失败）
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { workspace = true, features = ["whisper-cpp", "whisper-metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-rs = { workspace = true, features = ["whisper-cpp"] }

[dev-dependencies]
tempfile = "3.0"


[features]
default = []
# STT GPU 加速（transcribe-rs 后端）：
# - macOS 默认已 whisper-metal（见上方 [target] 段），无需 --features
# - Linux 用 cuda（NVIDIA + CUDA toolkit）或 vulkan（Vulkan SDK）
cuda = ["transcribe-rs/whisper-cuda"]
vulkan = ["transcribe-rs/whisper-vulkan"]
