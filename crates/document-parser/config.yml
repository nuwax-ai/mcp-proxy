# 环境配置
environment: "development"

server:
  port: 8077
  host: "0.0.0.0"

log:
  level: "info"
  path: "logs"
  # The number of log files to retain (default: 20)
  retain_days: 20

# 文档解析配置
document_parser:
  # 并发控制
  max_concurrent: 5
  queue_size: 1000
  
  # 超时设置（统一超时配置）
  download_timeout: 3600
  processing_timeout: 3600  # 60分钟，用于MinerU和MarkItDown解析超时

  # 同步解析接口（/parse-sync）配置，仅供测试验证使用
  sync_parse_max_file_size: "500MB"  # 同步接口请求体大小上限（路由级 middleware 限制，超限返回 413）
  sync_parse_max_concurrent: 2      # 同步接口并发上限（MinerU 为重资源，限流 2 路）
  sync_parse_timeout_secs: 600      # 同步接口整体超时（10分钟）

# MinerU配置
mineru:
  # 后端选择：pipeline|vlm-engine|hybrid-engine|vlm-http-client|hybrid-http-client，有 cuda 推荐 hybrid-engine（mineru 3.4 默认）
  # mac 本地测试：无 vllm/CUDA → pipeline + MPS(Metal)。生产 Linux CUDA 用 hybrid-engine
  backend: "pipeline"
  python_path: "./venv/bin/python"  # 默认使用虚拟环境，如不存在则自动检测系统Python
  # 这个是mineru的并发数，目前没用,占位使用,只需要小于document_parser.max_concurrent 即可
  max_concurrent: 1
  queue_size: 100
  # timeout 已移除，统一使用 document_parser.processing_timeout (3600秒)
  batch_size: 1
  quality_level: "Balanced"
  # 推理设备：cpu/cuda/mps等。mac Metal 用 mps（通过 MINERU_DEVICE_MODE 传给 mineru 3.4）
  device: "mps"
  # 单进程GPU显存占用(GB)，通过 MINERU_VIRTUAL_VRAM_SIZE 环境变量传给 mineru 3.4，0=不限
  vram: 0
  # vllm 显存占用比例(仅 hybrid-engine/vlm-engine)，通过 --gpu-memory-utilization 传给 mineru 3.4。
  # 0=用 mineru 默认(约0.5)；与 voice-cli 等其他 GPU 进程共存时建议 0.3 避免 OOM
  gpu_memory_utilization: 0.3

# MarkItDown配置
markitdown:
  python_path: "./venv/bin/python"  # 默认使用虚拟环境，如不存在则自动检测系统Python
  # timeout 已移除，统一使用 document_parser.processing_timeout (3600秒)
  enable_plugins: false
  
  # 功能开关
  features:
    ocr: true
    audio_transcription: true
    azure_doc_intel: false
    youtube_transcription: false

# 存储配置
storage:
  # Sled数据库配置
  sled:
    path: "data/document_parser"
    cache_capacity: 104857600  # 100MB
    
  # OSS配置
  oss:
    endpoint: "oss-rg-china-mainland.aliyuncs.com"
    # 公共bucket，用于存储公共文件，如文档文件
    public_bucket: "nuwa-packages"
    # 私有bucket，用于存储私有文件，如模型文件
    private_bucket: "edu-nuwa-packages"
    access_key_id: "${OSS_ACCESS_KEY_ID}"  # 通过环境变量设置
    access_key_secret: "${OSS_ACCESS_KEY_SECRET}"  # 通过环境变量设置
    region: "oss-rg-china-mainland"
    upload_directory: "document_parser"  # 上传文件的统一子目录前缀

  # 自定义文件上传后端（nuwax 风格 REST API）——可选，与 OSS 二选一
  # base_url 留空/整段缺省 = 未启用（解析产物走上面的 OSS）
  # 配置后：不带 upload_* 请求参数的请求默认走此后端；请求级参数可逐项覆盖
  # 接口契约：POST {base_url}{path}?type=store|tmp，Authorization: Bearer <api_key>，
  #          multipart 字段 file；响应 code=="0000" 且 data.url/data.key 为上传结果
  # 注意：api_key 会以明文保存在任务记录中（内网部署取舍）
  custom_upload:
    base_url: ""                      # 例：https://agent.example.com
    api_key: ""                       # Bearer API Key
    path: "/api/v1/file/upload"       # 上传接口路径（默认 nuwax 契约）

# 全局文件大小配置
file_size_config:
  max_file_size: "500MB"
  large_document_threshold: "50MB"

# 外部集成配置
external_integration:
  webhook_url: ""
  api_key: ""
  timeout: 30
