[package]
name = "rs-voice-toolkit-tts"
version = "0.16.1"
description = "Text-to-speech functionality for rs-voice-toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soddygo/rs-voice-toolkit"
keywords = ["speech", "synthesis", "tts", "text-to-speech"]
categories = ["multimedia::audio"]
edition = "2024"
authors = ["rs-voice-toolkit contributors"]

[lib]
name = "rs_voice_toolkit_tts"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
which = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
