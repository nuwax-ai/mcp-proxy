[workspace]
# run-code-rmcp 为 vendor 的源码（原 run_code_rmcp = "0.0.37"），方便本地维护
# fastembed 现已纳入 workspace：共享 Cargo.lock / 版本继承 / cargo test --workspace。
# 但 ort-sys 编译期需联网下载预编译库 + 编译耗时数分钟，故放入 default-members 之外：
# 裸 cargo build/test/check 默认不碰 fastembed（快、离线友好），
# 显式 cargo (build|test) -p fastembed-server 或 --workspace 才编译它。
members = [
    "crates/voice-toolkit",
    "crates/rs-voice-toolkit-audio",
    "crates/document-parser",
    "crates/mcp-common",
    "crates/mcp-proxy",
    "crates/mcp-sse-proxy",
    "crates/mcp-streamable-proxy",
    "crates/oss-client",
    "crates/run-code-rmcp",
    "crates/systemd-installer",
    "crates/voice-cli",
    "crates/fastembed",
]
default-members = [
    "crates/voice-toolkit",
    "crates/rs-voice-toolkit-audio",
    "crates/document-parser",
    "crates/mcp-common",
    "crates/mcp-proxy",
    "crates/mcp-sse-proxy",
    "crates/mcp-streamable-proxy",
    "crates/oss-client",
    "crates/run-code-rmcp",
    "crates/systemd-installer",
    "crates/voice-cli",
]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# 统一版本管理：所有 crate 用 version.workspace = true 继承此处版本，bump 只改这一处
[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
# 内部 crate（依赖版本串也集中在此，配合 [workspace.package] 实现根一处维护）
mcp-proxy = { version = "0.2.1", path = "crates/mcp-proxy" }
mcp-common = { version = "0.2.1", path = "crates/mcp-common" }
mcp-sse-proxy = { version = "0.2.1", path = "crates/mcp-sse-proxy" }
mcp-streamable-proxy = { version = "0.2.1", path = "crates/mcp-streamable-proxy" }
oss-client = { version = "0.2.1", path = "crates/oss-client" }
systemd-installer = { version = "0.2.0", path = "crates/systemd-installer" }
# run_code_rmcp 已 vendor 到本地（crates/run-code-rmcp/），不再从 crates.io 拉取
run_code_rmcp = { path = "crates/run-code-rmcp" }
# voice-toolkit 已 vendor 到本地（crates/voice-toolkit 等 4 个 crate），不再从 crates.io 拉取
voice-toolkit = { path = "crates/voice-toolkit", features = ["audio"] }
# FFmpeg wrapper：统一到 2.5（voice-cli 原 2.2 + voice crates 2.5 → 合并）
ffmpeg-sidecar = "2.5"
# STT 引擎（替代 vendor 的 rs-voice-toolkit-stt）：transcribe-rs 0.3.11 依赖 ort=2.0.0-rc.12，
# 与 fastembed 的 ort 版本完全一致，共存无冲突。GPU feature（whisper-metal/cuda/vulkan）
# 由 voice-cli 按平台 [target.'cfg'] 选用，不在此处统一开。
transcribe-rs = "0.3.11"
# TTS/STT 引擎：sherpa-onnx 官方 crate，自带 onnxruntime C 库（与 fastembed/transcribe-rs
# 的 ort 隔离，三套引擎同属 ONNX 生态）。-sys 编译期从 github releases 下载预编译库
# （或 SHERPA_ONNX_ARCHIVE_DIR 本地缓存）。
# default-features=false：由各 crate 按平台选 static/shared（见 voice-cli Cargo.toml）。
#   关键：macOS **static** 变体编译时禁用 CoreML（session.cc #else → CPU 回退）；
#   macOS **shared** 变体启用 CoreML EP → STT sherpa 三引擎可走 Mac GPU/ANE。
# ⚠️ 钉 1.13.3（**不**用 1.13.4）：1.13.4 bundle 的 onnxruntime 1.27.0 在本机 macOS 启动即被
#   SIGKILL（--help 都 exit 137，main 前死；非内存/非 codesign/非下载损坏，重新下载复现）。
#   1.13.3 的 onnxruntime 1.24.4 正常。`version="1.13.3"` 仍允许 1.13.4，靠 Cargo.lock 钉；
#   若 `cargo update` 升到 1.13.4 会复发，需 `cargo update -p sherpa-onnx --precise 1.13.3` 回退。
sherpa-onnx = { version = "1.13.3", default-features = false }
# 繁→简中文转换（STT 后处理）：纯 Rust 核心，字典编译期内嵌，zstd 复用现有依赖树
ferrous-opencc = "0.4"

# Note: rmcp 依赖由各子项目独立管理（mcp-sse-proxy 用 0.10，mcp-streamable-proxy 用 0.12）
tokio = { version = "1.52", features = ["macros", "net", "rt", "rt-multi-thread"] }
tokio-util = "0.7"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-jaeger = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tonic = "0.14"
hostname = "0.4"
uuid = { version = "1.23", features = ["v4", "v7"] }
rand = "0.10"
log = "0.4"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "now"] }
thiserror = "2.0"
axum = { version = "0.8", features = [
    "http2",
    "query",
    "tracing",
    "ws",
    "multipart",
    "macros",
] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = [
    "compression-full",
    "cors",
    "fs",
    "trace",
    "limit",
] }
axum-extra = { version = "0.12", features = ["typed-header"] }
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-rapidoc = { version = "6", features = ["axum"] }
utoipa-redoc = { version = "6", features = ["axum"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
dashmap = "6.1"
arc-swap = "1.9"
moka = { version = "0.12", features = ["future"] }
criterion = "0.8"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.33"
serde_with = "3.21"
# reqwest：非 STT crate（mcp-proxy/oss-client/document-parser/mcp-streamable-proxy）用 workspace 0.13。
# voice-cli / mcp-sse-proxy 各自 0.12 inline（见各 Cargo.toml：rmcp trait 对齐 + 避免 0.13 的 aws-lc-rs
# 令 STT 重二进制启动被 macOS jetsam SIGKILL）。0.13 default features 即 rustls（无 native TLS）。
reqwest = { version = "0.13", features = ["json"] }
http = "1.4"
aliyun-oss-rust-sdk = { version = "0.2", default-features = false, features = ["async"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"

derive_builder = "0.20"
bytes = "1.12"
base64 = "0.22"
tempfile = "3.27"
dirs = "6.0"
scopeguard = "1.2"

# voice-cli 专用（迁入 workspace 统一版本；除 reqwest 外 voice-cli 不再 inline 版本）
# config-rs（the `config` crate）：YAML/JSON/TOML 配置加载
config = { version = "0.15", features = ["yaml", "json", "toml"] }
url = "2.5"
infer = "0.19"
# Windows 仅：窗口/进程信息（voice-cli daemon 模式）
winapi = { version = "0.3", features = ["winuser", "processthreadsapi"] }

async-trait = "0.1"

# Task queue and persistence for async processing
apalis = { version = "0.7", features = ["tracing", "limit"] }
apalis-sql = { version = "0.7", features = ["sqlite"] }
# sqlx 0.8（**不**升 0.9）：0.8→0.9 是 breaking（Pool<Sqlite> API 变），需改 voice-cli 代码，
# 留作单独迁移。0.9 的特性名也改了（runtime-tokio-rustls 拆成 runtime-tokio + tls-*）。
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
sled = "0.34"

# 可执行文件查找
which = "8.0"

# 国际化支持
rust-i18n = "4"

# Audio format detection and processing
symphonia = { version = "0.6", features = ["all"] }
tokio-stream = "0.1.18"
backtrace = "0.3"
tracing-futures = "0.2.5"
urlencoding = "2.1.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
